<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>전력변환연구실 | Power Conversion Lab · 경남대학교 전기공학과</title>
<meta name="description" content="경남대학교 전기공학과 전력변환연구실 — 전동기 드라이브, 다상 전동기 고장 진단, 센서리스 제어, 계통연계 인버터 연구">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23000'/><path d='M37.20 7.55 A25 25 0 0 1 55.78 39.73' fill='none' stroke='%23F5B23E' stroke-width='6' stroke-linecap='round'/><path d='M50.58 48.73 A25 25 0 0 1 13.42 48.73' fill='none' stroke='%238FB3FF' stroke-width='6' stroke-linecap='round'/><path d='M8.22 39.73 A25 25 0 0 1 26.80 7.55' fill='none' stroke='%23FFFFFF' stroke-width='6' stroke-linecap='round'/><path d='M17 36 h6 v-10 h9 v14 h9 v-10 h6' fill='none' stroke='%23FFFFFF' stroke-width='3.8' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:dark;
  --navy:#F2F4F8; --fill:#1F2937; --blue:#8FB3FF; --blue-2:#4F7DF5; --blue-light:#1C2433; --blue-soft:#161A22;
  --amber:#F5B23E; --amber-dark:#F5B23E; --amber-light:#3A2E12;
  --ink:#E8EAEF; --muted:#9AA3B2; --line:#262B35; --bg:#000000; --bg-soft:#0C0E12; --card:#121419;
  --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.6;font-size:16px;overflow-x:hidden;word-break:keep-all}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.missing{color:var(--amber);background:var(--amber-light);border-radius:3px;padding:0 3px}

/* ─ header ─ */
header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.82);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .mark{width:38px;height:38px;border-radius:10px;background:#000;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.brand .mark svg{width:30px;height:30px}
.brand .sub{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;line-height:1.1}
.brand .nm{display:block;font-size:17px;line-height:1.15}
nav.main{margin-left:auto;display:flex;gap:2px}
nav.main a{padding:8px 12px;border-radius:8px;font-weight:600;color:var(--ink);font-size:15px}
nav.main a:hover{background:var(--blue-soft);text-decoration:none}
nav.main a.on{color:var(--blue);background:var(--blue-light)}
.lang{border:1px solid var(--line);background:var(--bg-soft);border-radius:999px;padding:0;display:flex;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:6px 11px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--amber);color:#111}
@media (max-width:860px){
  .hdr{height:auto;flex-wrap:wrap;padding:10px 0 8px;gap:8px 12px}
  .brand{flex:1;min-width:0}.brand .nm{font-size:15px}.brand .sub{font-size:10px}
  nav.main{order:3;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 0}
  nav.main a{text-align:center;padding:9px 4px;font-size:13.5px;background:var(--bg-soft)}
}

/* ─ pages ─ */
main>section{display:none;padding:40px 0 72px}
main>section.show{display:block}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.015em;margin:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.page-h h1{font-size:34px;font-weight:800;color:var(--navy)}
.page-h p{margin:6px 0 0;color:var(--muted);max-width:720px}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-dark);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--blue-light);color:var(--blue);vertical-align:middle}
.badge.new{background:var(--amber);color:#111}
.badge.ongoing{background:#0F2E20;color:#5EDB94}
.badge.done{background:#1F2430;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 18px;font-weight:700;border:1px solid transparent;cursor:pointer;font-size:15px;line-height:1}
.btn:hover{text-decoration:none}
.btn.primary{background:var(--amber);color:#111}
.btn.primary:hover{background:#E09A10}
.btn.ghost{background:transparent;border-color:#3A4150;color:var(--navy)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--blue-soft);border:1px solid #2E3442;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:#C9D8FF}
.sect{margin-top:48px}
.sect h2{font-size:24px;font-weight:800;color:var(--navy);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.sect h2 .cnt{font-size:13px;font-weight:700;color:var(--muted);background:var(--blue-soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.empty{color:var(--muted);background:var(--bg-soft);border:1px dashed var(--line);border-radius:12px;padding:18px 20px;text-align:center}

/* ─ hero ─ */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center;padding:28px 0 10px}
.hero h1{font-size:44px;font-weight:900;color:var(--navy);letter-spacing:-.03em;line-height:1.12}
.hero h1 small{display:block;font-size:17px;font-weight:600;color:var(--muted);letter-spacing:0;margin-bottom:12px;line-height:1.4}
.hero .tag{font-size:19px;color:var(--blue);font-weight:600;margin:14px 0 18px}
.hero .lead{color:var(--ink);font-size:16.5px;max-width:560px;white-space:pre-line}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero-art{position:relative;background:radial-gradient(120% 90% at 20% 0%,#1A2030,#0A0C10 70%);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.hero-art svg{width:100%;height:auto;display:block}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:22px}.hero h1{font-size:34px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.stat{background:linear-gradient(150deg,#1A1F2B,#111419);color:#fff;border:1px solid #2A3040;border-radius:14px;padding:18px 20px}
.stat b{display:block;font-size:30px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
.stat span{font-size:13px;opacity:.85;font-weight:600}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.home-news .item{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.home-news .item:last-child{border:0}
.recruit{background:linear-gradient(135deg,#1E2A48,#2E63D9);color:#fff;border-radius:18px;padding:30px}
.recruit h2{color:#fff;font-size:24px}
.recruit p{opacity:.92}
.recruit ul{margin:14px 0 20px;padding-left:20px}
.recruit li{margin:6px 0}
.recruit .btn.primary{background:var(--amber);color:#111}

/* ─ inverter→motor animation ─ */
.sw rect.body{fill:#161A22;stroke:#A9BEEF;stroke-width:1.6}
.sw .gate{fill:var(--amber);opacity:.12}
.sw.a .gate{animation:gate 1.8s steps(1) infinite}
.sw.b .gate{animation:gate 1.8s steps(1) .9s infinite}
@keyframes gate{0%,49%{opacity:1}50%,100%{opacity:.12}}
.sw.p2.a .gate{animation-delay:.6s}.sw.p2.b .gate{animation-delay:1.5s}
.sw.p3.a .gate{animation-delay:1.2s}.sw.p3.b .gate{animation-delay:.3s}
.wave{fill:none;stroke-width:2.4;stroke-linecap:round}
.wave.u{stroke:var(--blue-2)} .wave.v{stroke:var(--amber)} .wave.w{stroke:#4ADE80}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.rotor{transform-origin:445px 150px;animation:spin 3.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pwm{stroke:#8FB3FF;stroke-width:1.6;fill:none;stroke-dasharray:420;animation:pwm 3s linear infinite}
@keyframes pwm{to{stroke-dashoffset:-420}}
@media (prefers-reduced-motion:reduce){
  .sw .gate,.flow,.rotor,.pwm{animation:none!important}
  .sw.a .gate{opacity:1}
  html{scroll-behavior:auto}
}

/* ─ news ─ */
.news-list .row{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.news-list .row .d{color:var(--muted);font-size:14px;padding-top:2px}
.news-list .row p{margin:0;white-space:pre-line}

/* ─ research ─ */
.area{display:grid;grid-template-columns:120px 1fr;gap:20px}
.area .ic{width:120px;height:120px;border-radius:16px;background:var(--blue-soft);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.area .ic img{width:100%;height:100%;object-fit:contain;background:#fff;padding:6px}
.area h3{font-size:19px;color:var(--navy);margin-bottom:8px}
.area p{margin:0 0 10px;color:#C7D0E4;white-space:pre-line}
@media (max-width:600px){.area{grid-template-columns:1fr}.area .ic{width:100%;height:120px}}
.proj{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.proj .t{font-weight:600}
.proj .s{color:var(--muted);font-size:14px}
.proj .p{color:var(--muted);font-size:13.5px;white-space:nowrap}
@media (max-width:600px){.proj{grid-template-columns:1fr}.proj .p{white-space:normal}}
details.more summary{cursor:pointer;color:var(--blue);font-weight:700;padding:12px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";}
details.more[open] summary::before{content:"▾ ";}

/* ─ professor ─ */
.prof{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
@media (max-width:860px){.prof{grid-template-columns:1fr}}
.prof .photo{aspect-ratio:3/3.6;border-radius:18px;background:linear-gradient(160deg,#1C2433,#121419);display:grid;place-items:center;color:var(--muted);overflow:hidden;border:1px solid var(--line)}
.prof .photo img{width:100%;height:100%;object-fit:cover}
.prof .photo .ph{text-align:center;font-size:13px;padding:20px}
.prof .photo .ph svg{width:70px;height:70px;margin:0 auto 8px;display:block;opacity:.5}
.prof .pname{margin-top:18px}
.prof .pname h2{font-size:26px;color:var(--navy)}
.prof .pname .role{color:var(--muted);font-weight:600}
.prof .ct{margin-top:14px;font-size:14.5px;display:grid;gap:6px}
.prof .ct div{display:flex;gap:8px;align-items:baseline}
.prof .ct .k{color:var(--muted);min-width:44px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.prof .ext{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border:0}
.tl .per{color:var(--muted);font-size:14px}
@media (max-width:520px){.tl li{grid-template-columns:1fr;gap:2px}}
.bio{font-size:16.5px;white-space:pre-line}
ul.plain{margin:0;padding-left:20px} ul.plain li{margin:4px 0}

/* ─ members ─ */
.mem{display:flex;gap:16px;align-items:flex-start}
.mem .av{width:72px;height:72px;border-radius:50%;background:var(--fill);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none;overflow:hidden}
.mem .av img{width:100%;height:100%;object-fit:cover}
.mem h3{font-size:17px}
.mem .r{color:var(--blue);font-size:13px;font-weight:700}
.mem p{margin:6px 0 0;font-size:14px;color:#C7D0E4}
.alumni{width:100%;border-collapse:collapse;font-size:14.5px}
.alumni th{text-align:left;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:2px solid var(--line)}
.alumni td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.alumni td.yr{color:var(--muted);white-space:nowrap}
@media (max-width:600px){.alumni thead{display:none}.alumni tr{display:grid;grid-template-columns:1fr;padding:8px 0;border-bottom:1px solid var(--line)}.alumni td{border:0;padding:1px 0}.alumni td.yr{font-size:12.5px}}

/* ─ alumni cards ─ */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px;max-width:1100px}

@media (max-width:600px){.agrid{grid-template-columns:repeat(3,1fr);gap:10px}}
.acard{text-align:center}
.aph{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--fill);border:1px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px}
.aph img{width:100%;height:100%;object-fit:cover;display:block}
.an{font-weight:700;margin-top:8px;font-size:15px}
.ao{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.agrp{margin-bottom:10px}

/* ─ publications ─ */
.pubsum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.pubsum .card{text-align:center;padding:16px}
.pubsum b{display:block;font-size:28px;font-family:var(--mono);color:var(--navy)}
.pubsum span{font-size:13px;color:var(--muted);font-weight:600}
@media (max-width:600px){.pubsum{grid-template-columns:repeat(2,1fr)}}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-size:15px}
.tabs button.on{color:var(--navy);border-color:var(--amber)}
.pubyear{margin:22px 0 10px;font-size:20px;color:var(--navy);display:flex;align-items:center;gap:12px}
.pubyear::after{content:"";flex:1;height:1px;background:var(--line)}
.pub{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.pub .n{color:var(--muted);font-size:13px;padding-top:3px}
.pub .ti{font-weight:600}
.pub .au{color:#C7D0E4;font-size:14px}
.pub .ve{color:var(--muted);font-size:13.5px;font-style:italic}
.pub .ve .idx{font-style:normal;margin-left:6px}
.pub .doi{font-size:13px;margin-left:6px}
.pubnote{font-size:13px;color:var(--muted);margin-top:18px}

/* ─ gallery ─ */
.ev{margin-bottom:26px}
.ev .evh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ev .evh h3{font-size:19px;color:var(--navy)}
.ev .evh .d{color:var(--muted);font-size:13.5px}
.ev p.desc{margin:0 0 12px;color:#C7D0E4;white-space:pre-line}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.photos{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.photos{grid-template-columns:repeat(2,1fr)}}
.ph{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--bg-soft);border:1px solid var(--line);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.ph:hover img{transform:scale(1.04)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 9px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.ph.empty-ph{display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:default;border-style:dashed}
.ph .ictl{position:absolute;top:6px;left:6px;z-index:2}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.strip{grid-template-columns:repeat(2,1fr)}}
dialog.lb{background:transparent;border:0;max-width:min(96vw,1200px);width:auto;box-shadow:none;padding:0}
dialog.lb img{max-width:min(96vw,1200px);max-height:84vh;border-radius:10px;display:block;margin:0 auto}
dialog.lb .lbc{color:#fff;text-align:center;padding:10px;font-size:14px}
dialog.lb .lbx{position:absolute;top:-4px;right:-4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer}
dialog.lb::backdrop{background:rgba(0,0,0,.88)}

/* ─ contact ─ */
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:start}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.contact .ct div{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.contact .ct .k{color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.map{border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/11;background:var(--bg-soft)}
.map iframe{filter:invert(.92) hue-rotate(180deg) saturate(.8)}
.map iframe{width:100%;height:100%;border:0;display:block}

/* ─ footer ─ */
footer{border-top:1px solid var(--line);background:var(--bg-soft);padding:30px 0 40px;color:var(--muted);font-size:13.5px}
footer .f{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
#adminBtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}

/* ─ admin ─ */
#adminBar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:90;background:#000;border-top:1px solid var(--line);color:#fff;padding:10px 16px;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
body.admin #adminBar{display:flex}
body.admin{padding-bottom:84px}
#adminBar b{margin-right:6px}
#adminBar button{border:1px solid #374151;background:#1F2937;color:#fff;border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;font-weight:600}
#adminBar button.save{background:var(--amber);color:#111;border-color:transparent}
#adminBar .dirty{color:var(--amber);font-size:13px;margin-left:auto}
body.admin [data-edit]{outline:1.5px dashed rgba(18,73,181,.55);outline-offset:2px;border-radius:3px;min-width:12px;cursor:text}
body.admin [data-edit]:focus{outline:2px solid var(--amber);background:#2A2410}
body.admin [data-edit]:empty::before{content:"(비어 있음)";color:#6B7A99}
.ictl{display:none;gap:4px;margin:6px 0 2px}
body.admin .ictl{display:inline-flex}
.ictl button{border:1px solid #3A4150;background:#1A1F2B;border-radius:6px;font-size:12px;padding:2px 7px;cursor:pointer;color:var(--ink)}
.ictl button:hover{background:var(--blue-soft)}
.ictl button.del{color:#F87171}

/* ========================= 라우팅 ========================= */
function route(){
  let id=(location.hash||'#home').slice(1).split('?')[0];
  if(!PAGES.some(p=>p[0]===id))id='home';
  $$('main>section').forEach(s=>s.classList.toggle('show',s.id==='page-'+id));
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.page===id));
  window.scrollTo({top:0,behavior:'instant'});
  gcCount(id);
}
window.addEventListener('hashchange',route);
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('lang',lang);render();}));

/* ========================= 방문자 통계 (GoatCounter) ========================= */
function gcInit(){
  const code=D.site.goatcounter;if(!code||localStorage.getItem('skipgc')==='t'||location.protocol==='file:')return;
  window.goatcounter={no_onload:true};
  const s=document.createElement('script');s.async=true;s.src='https://gc.zgo.at/count.js';s.dataset.goatcounter='https://'+code+'.goatcounter.com/count';document.head.appendChild(s);
}
function gcCount(id){if(window.goatcounter&&window.goatcounter.count&&!(localStorage.getItem('skipgc')==='t'))window.goatcounter.count({path:(D.site.repoPath||location.pathname.replace(/\/$/,''))+'/'+id});}

/* ========================= 관리자 ========================= */
function markDirty(){dirty=true;$('#dirty').textContent='● 저장되지 않은 변경';}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
const toast=(m)=>{const el=$('#toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600);};

function bindEditing(){
  $$('[data-edit]').forEach(el=>{
    if(el.isContentEditable)return;
    el.setAttribute('contenteditable','plaintext-only');
    if(!el.isContentEditable)el.setAttribute('contenteditable','true');
    el.addEventListener('input',()=>{set(el.dataset.edit,el.innerText.replace(/\n$/,''));markDirty();});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&el.tagName!=='P'){e.preventDefault();el.blur();}});
    el.addEventListener('click',e=>{if(e.target.closest('a'))e.preventDefault();});
  });
  $$('[data-img]').forEach(el=>{el.onclick=(e)=>{e.preventDefault();e.stopPropagation();imageDialog(el.dataset.img);};});
}
function unbindEditing(){$$('[data-edit]').forEach(el=>el.removeAttribute('contenteditable'));}
function enterAdmin(){admin=true;document.body.classList.add('admin');localStorage.setItem('skipgc','t');render();toast('관리자 모드: 점선 글자를 클릭해 수정하세요');}
function exitAdmin(){if(dirty&&!confirm('저장하지 않은 변경이 있습니다. 편집을 종료할까요?'))return;admin=false;token=null;document.body.classList.remove('admin');unbindEditing();render();}

$('#adminBtn').addEventListener('click',()=>{ if(admin){exitAdmin();return;} if(!(window.crypto&&crypto.subtle)){toast('관리자 기능은 공개된 주소(https://…github.io)에서 사용할 수 있습니다.');return;} D.admin&&D.admin.ct?loginDialog():setupDialog(); });
$('#adminBar').addEventListener('click',e=>{
  const act=e.target.dataset.act;if(!act)return;
  ({save:saveDialog,site:()=>editFields('site',render,'사이트 설정'),download:downloadHtml,backup:backupJson,restore:restoreJson,stats:openStats,reset:resetDialog,exit:exitAdmin})[act]();
});

/* ─ dialog helper ─ */
function dialog(title,hint,body,buttons){
  const dlg=$('#dlg');dlg.replaceChildren(h('form',{class:'dlg',method:'dialog',onsubmit:e=>e.preventDefault()},h('h3',null,title),hint?h('p',{class:'hint'},hint):null,body,h('div',{class:'err',id:'dlgErr'}),
    h('div',{class:'acts'},buttons.map(([label,fn,cls])=>h('button',{type:'button',class:'btn '+(cls||'ghost'),onclick:fn},label)))));

}
const err=(m,ok)=>{const e=$('#dlgErr');if(e){e.textContent=m||'';e.classList.toggle('ok',!!ok);}};
const close=()=>$('#dlg').close();
const field=(label,attrs)=>[h('label',null,label),h('input',Object.assign({autocomplete:'off'},attrs))];

/* ─ crypto: PBKDF2 → AES-GCM ─ */
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=u8=>{let r='';for(let i=0;i<u8.length;i+=0x8000)r+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(r);}, unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptToken(pw,tok){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(tok)));
  return {salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function decryptToken(pw,a){
  const key=await deriveKey(pw,unb64(a.salt));
  try{return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(a.iv)},key,unb64(a.ct)));}catch(e){return null;}
}

/* ─ GitHub Contents API ─ */
const GH=(path,opt={})=>{
  const url='https://api.github.com/repos/'+D.admin.repo+'/contents/'+path;
  const f=window.FAKE_GH||fetch;
  return f(url,Object.assign({headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}},opt));
};
const utf8b64=s=>b64(enc.encode(s)), b64utf8=s=>dec.decode(unb64(s.replace(/\n/g,'')));
function serializeData(){return JSON.stringify(D,null,1).replace(/<\/script/gi,'<\\/script');}
function injectData(html){
  const re=/(<script id="site-data" type="application\/json">)([\s\S]*?)(<\/script>)/;
  if(!re.test(html))throw new Error('index.html에서 데이터 블록을 찾지 못했습니다.');
  return html.replace(re,(m,a,b,c)=>a+serializeData()+c);
}
async function currentHtml(){
  if(token&&D.admin.repo){const r=await GH('index.html?ref='+(D.admin.branch||'main'));if(r.ok){const j=await r.json();return {html:b64utf8(j.content),sha:j.sha};}}
  if(location.protocol!=='file:'){const r=await fetch(location.pathname,{cache:'no-store'});if(r.ok)return {html:await r.text(),sha:null};}
  throw new Error('현재 파일을 읽지 못했습니다 (로컬 파일에서는 게시 후에 사용할 수 있습니다).');
}
async function publish(message){
  D.meta=D.meta||{};D.meta.updated=new Date().toISOString().slice(0,10);
  const cur=await currentHtml();
  const html=injectData(cur.html);
  const body={message:message||'Update site content',content:utf8b64(html),branch:D.admin.branch||'main'};if(cur.sha)body.sha=cur.sha;
  const r=await GH('index.html',{method:'PUT',body:JSON.stringify(body)});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error('GitHub 오류 '+r.status+': '+(j.message||''));}
  dirty=false;$('#dirty').textContent='';return r;
}
async function uploadFile(path,file){
  const buf=new Uint8Array(await file.arrayBuffer());let s='';for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  let sha;const g=await GH(path+'?ref='+(D.admin.branch||'main'));if(g.ok)sha=(await g.json()).sha;
  const body={message:'Upload '+path,content:btoa(s),branch:D.admin.branch||'main'};if(sha)body.sha=sha;
  const r=await GH(path,{method:'PUT',body:JSON.stringify(body)});if(!r.ok)throw new Error('업로드 실패 '+r.status);return path;
}

/* ─ dialogs ─ */
function setupDialog(){
  dialog('관리자 초기 설정','이 사이트는 아직 관리자 설정이 없습니다. GitHub 접근 키(fine-grained, 이 저장소의 Contents 읽기/쓰기만)를 만들어 아래에 넣으세요.\n키는 비밀번호로 암호화되어 사이트 데이터에 저장되며 원문은 어디에도 남지 않습니다.',
    h('div',null,field('GitHub 저장소 (예: username/PowerConv)',{id:'f_repo',value:D.admin.repo||'',placeholder:'owner/repo'}),field('브랜치',{id:'f_branch',value:D.admin.branch||'main'}),
      field('GitHub 접근 키 (github_pat_…)',{id:'f_tok',type:'password'}),field('관리자 비밀번호 (10자 이상)',{id:'f_pw1',type:'password'}),field('비밀번호 확인',{id:'f_pw2',type:'password'})),
    [['취소',close],['설정하고 게시',async()=>{
      const repo=$('#f_repo').value.trim(),br=$('#f_branch').value.trim()||'main',tok=$('#f_tok').value.trim(),p1=$('#f_pw1').value,p2=$('#f_pw2').value;
      if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return err('저장소는 owner/repo 형식으로 입력하세요.');
      if(!tok)return err('접근 키를 입력하세요.');if(p1.length<10)return err('비밀번호는 10자 이상이어야 합니다.');if(p1!==p2)return err('비밀번호가 서로 다릅니다.');
      err('암호화 중…',true);
      try{const a=await encryptToken(p1,tok);D.admin={repo,branch:br,...a};token=tok;err('GitHub에 게시 중…',true);await publish('Set up admin');close();enterAdmin();toast('설정 완료. 1~2분 뒤 사이트에 반영됩니다.');}
      catch(e){token=null;err(e.message);}
    },'primary']]);
}
function loginDialog(){
  dialog('관리자 로그인',null,h('div',null,field('비밀번호',{id:'f_pw',type:'password',autofocus:true})),
    [['취소',close],['로그인',async()=>{
      err('확인 중…',true);const tok=await decryptToken($('#f_pw').value,D.admin);
      if(!tok)return err('비밀번호가 올바르지 않습니다.');token=tok;close();enterAdmin();
    },'primary']]);
  const inp=$('#f_pw');inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$$('#dlg .acts button')[1].click();}});
}
function saveDialog(){
  if(!token)return toast('로그인이 필요합니다.');
  dialog('저장 및 게시','GitHub의 index.html을 지금 내용으로 갱신합니다. 반영까지 1~2분 걸립니다.',h('div',null,field('변경 내용 메모 (선택)',{id:'f_msg',placeholder:'예: 2026년 2월 졸업생 추가'})),
    [['취소',close],['게시',async()=>{err('게시 중…',true);try{await publish($('#f_msg').value.trim()||undefined);close();toast('게시했습니다. 1~2분 뒤 새로고침(Ctrl+F5)하세요.');}catch(e){err(e.message);}},'primary']]);
}
function resetDialog(){
  dialog('비밀번호·키 재설정','새 접근 키를 비워 두면 기존 키를 그대로 사용합니다.',
    h('div',null,field('새 GitHub 접근 키 (선택)',{id:'f_tok',type:'password'}),field('새 비밀번호 (10자 이상)',{id:'f_pw1',type:'password'}),field('비밀번호 확인',{id:'f_pw2',type:'password'})),
    [['취소',close],['재설정하고 게시',async()=>{
      const tok=$('#f_tok').value.trim()||token,p1=$('#f_pw1').value,p2=$('#f_pw2').value;
      if(p1.length<10)return err('비밀번호는 10자 이상이어야 합니다.');if(p1!==p2)return err('비밀번호가 서로 다릅니다.');
      try{err('처리 중…',true);const a=await encryptToken(p1,tok);const old=D.admin;D.admin={repo:old.repo,branch:old.branch,...a};const prev=token;token=tok;
        try{await publish('Reset admin credentials');}catch(e){D.admin=old;token=prev;throw e;}close();toast('재설정했습니다.');}catch(e){err(e.message);}
    },'primary']]);
}
function imageDialog(path){
  const cur=get(path)||'';const isFile=/cvFile|\.path$/.test(path);
  dialog(isFile?'파일 설정':'그림 설정','저장소 안의 경로를 적거나(예: images/prof.jpg), 파일을 골라 저장소에 올립니다. 비우면 기본 표시로 돌아갑니다.',
    h('div',null,field('경로',{id:'f_path',value:cur,placeholder:isFile?'files/cv.pdf':'images/photo.jpg'}),h('label',null,'파일 올리기'),h('input',{type:'file',id:'f_file',accept:isFile?'.pdf':'image/*'})),
    [['취소',close],['비우기',()=>{set(path,'');markDirty();close();render();},'ghost'],['적용',async()=>{
      const f=$('#f_file').files[0];let p=$('#f_path').value.trim();
      try{ if(f){ if(!token)throw new Error('업로드하려면 로그인한 상태여야 합니다.'); const folder=isFile?'files/':'images/'; p=folder+f.name.replace(/[^\w.\-가-힣]/g,'_'); err('업로드 중…',true); await uploadFile(p,f);} set(path,p);markDirty();close();render(); }catch(e){err(e.message);}
    },'primary']]);
}
/* 객체의 모든 문자열 필드를 폼으로 편집 */
function editFields(path,onchange,title){
  const obj=get(path);if(!obj||typeof obj!=='object')return;
  const rows=[];
  const walk=(o,pre)=>{for(const [k,v] of Object.entries(o)){
    if(k==='admin'||k==='stats')continue;
    if(isB(v)){rows.push([pre+k+' (KO)',pre+k+'.ko',v.ko]);rows.push([pre+k+' (EN)',pre+k+'.en',v.en]);}
    else if(typeof v==='string'||typeof v==='number')rows.push([pre+k,pre+k,String(v)]);
    else if(Array.isArray(v)&&v.every(x=>typeof x==='string'))rows.push([pre+k+' (쉼표로 구분)',pre+k,v.join(', '),'arr']);
    else if(v&&typeof v==='object'&&!Array.isArray(v))walk(v,pre+k+'.');
  }};walk(obj,'');
  dialog(title||'항목 편집',null,h('div',null,rows.map(([label,p,val,kind])=>[h('label',null,label),
    (val&&val.length>70)?h('textarea',{'data-f':p,'data-kind':kind||''},val):h('div',{class:'row'},h('input',{'data-f':p,'data-kind':kind||'',value:val}),/photo|image|cvFile|^path$|\.path$/.test(p)?h('button',{type:'button',class:'btn ghost sm',onclick:()=>{close();imageDialog(path+'.'+p);}},'파일'):null)])),
    [['취소',close],['적용',()=>{$$('#dlg [data-f]').forEach(i=>{let v=i.value;if(i.dataset.kind==='arr')v=v.split(',').map(s=>s.trim()).filter(Boolean);set(path+'.'+i.dataset.f,v);});markDirty();close();(onchange||render)();},'primary']]);
}
async function downloadHtml(){
  try{const cur=await currentHtml();const html=injectData(cur.html);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';a.click();}
  catch(e){toast(e.message);}
}
function backupJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='site-data-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function restoreJson(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());if(!j.site||!j.publications)throw new Error('이 사이트의 백업 파일이 아닙니다.');const keepAdmin=D.admin;D=j;D.admin=keepAdmin;markDirty();render();toast('불러왔습니다. [저장 및 게시]로 반영하세요.');}catch(e){toast(e.message);}};
  i.click();
}
function openStats(){const c=D.site.goatcounter;if(!c)return toast('사이트 설정에서 GoatCounter 코드를 먼저 입력하세요.');window.open('https://'+c+'.goatcounter.com','_blank','noopener');}

/* ─ 테스트 훅 (관리자 기능 시험용) ─ */
window.__pcl={get data(){return D;},publish,encryptToken,decryptToken,injectData,serializeData,enter:enterAdmin};

render();gcInit();
})();
